version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    # One pull request for all minor and patch updates (majors stay separate), so Monday does not open several branches at
    # once. A burst of pushes made GitHub rate-limit Vercel's fetch ("Preview deployment failed ... status 403").
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ESLint 10 breaks the React lint plugin bundled with eslint-config-next
      # (it calls an API ESLint 10 removed). Revisit when Next's config supports it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
