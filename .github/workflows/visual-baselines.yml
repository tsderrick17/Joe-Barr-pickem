name: Record Linux visual baselines

# Manual only. Run on a branch after an intended visual change, download the
# artifact, and commit the files it contains. It never pushes anything itself.
on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Record every picture afresh and leave out any no test uses (after removing or renaming tests). Commit the artifact in place of test/visual/*-snapshots."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.prune }}
        run: npm run test:visual -- -u
      - if: ${{ inputs.prune }}
        run: |
          find test/visual -name "*-linux.png" -delete
          npm run test:visual -- --update-snapshots=all
      - run: node --test test/email-artwork-baseline.test.mjs
        env:
          EMAIL_BASELINE_UPDATE: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-baselines
          path: |
            test/visual/**/*-linux.png
            test/email-artwork-baselines/linux/
          retention-days: 7
