name: Isolated Supabase migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pending migrations to the isolated test database (leave off for a dry run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# This workflow is intentionally separate from production. It can never use the
# production project reference, and it needs an explicit manual run before it
# changes the disposable test database.
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: isolated-test
    env:
      # The test project uses the newer API-key format, which some Supabase
      # CLI releases cannot inspect during `supabase link`. A direct database
      # URL avoids that lookup completely while remaining isolated.
      PICKEM_TEST_DATABASE_URL: ${{ secrets.PICKEM_TEST_DATABASE_URL }}
      SUPABASE_PROJECT_ID: lrimviwfflrisshmgnsh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare isolated schema bootstrap
        run: node scripts/prepare-isolated-schema.mjs
      - name: Confirm isolated target
        run: |
          test "$SUPABASE_PROJECT_ID" = "lrimviwfflrisshmgnsh"
          echo "Using isolated test project only."
      - name: Confirm isolated database URL
        run: |
          test -n "$PICKEM_TEST_DATABASE_URL"
          case "$PICKEM_TEST_DATABASE_URL" in
            *"lrimviwfflrisshmgnsh"*) echo "Using isolated test database only." ;;
            *) echo "Refusing a database URL that is not the isolated test project." >&2; exit 1 ;;
          esac
      - name: Preview pending migrations
        # Include a newly generated baseline even when a previous failed
        # isolated run left later migration receipts behind.
        run: supabase db push --db-url "$PICKEM_TEST_DATABASE_URL" --dry-run --include-all
  deploy:
    needs: preview
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    environment: isolated-test
    concurrency:
      group: supabase-isolated-test-migrations
      cancel-in-progress: false
    env:
      PICKEM_TEST_DATABASE_URL: ${{ secrets.PICKEM_TEST_DATABASE_URL }}
      SUPABASE_PROJECT_ID: lrimviwfflrisshmgnsh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare isolated schema bootstrap
        run: node scripts/prepare-isolated-schema.mjs
      - name: Confirm isolated target
        run: |
          test "$SUPABASE_PROJECT_ID" = "lrimviwfflrisshmgnsh"
          echo "Using isolated test project only."
      - name: Confirm isolated database URL
        run: |
          test -n "$PICKEM_TEST_DATABASE_URL"
          case "$PICKEM_TEST_DATABASE_URL" in
            *"lrimviwfflrisshmgnsh"*) echo "Using isolated test database only." ;;
            *) echo "Refusing a database URL that is not the isolated test project." >&2; exit 1 ;;
          esac
      - name: Repair empty isolated migration history
        # Older failed setup attempts recorded migrations without ever creating
        # the public schema. Only an entirely empty isolated database is
        # repaired; a database with application tables is never rewritten here.
        run: |
          public_table_count="$(psql "$PICKEM_TEST_DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE';")"
          if [ "$public_table_count" = "0" ]; then
            versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | tr '\n' ' ')"
            supabase migration repair --db-url "$PICKEM_TEST_DATABASE_URL" --status reverted $versions
          else
            echo "Isolated database already has public tables; leaving migration history unchanged."
          fi
      - name: Apply pending migrations
        run: supabase db push --db-url "$PICKEM_TEST_DATABASE_URL" --include-all
