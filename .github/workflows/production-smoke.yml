name: Production smoke gate

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PICKEM_SMOKE_BASE_URL: https://pickemjb.vercel.app
      PICKEM_SMOKE_ATTEMPTS: "12"
      PICKEM_SMOKE_RETRY_MS: "10000"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify deployed site and operational contracts
        run: node scripts/production-smoke.mjs
