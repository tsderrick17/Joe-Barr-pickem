name: Lock official NFL lines

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  lock-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Lock due official spreads
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/lock-lines"
