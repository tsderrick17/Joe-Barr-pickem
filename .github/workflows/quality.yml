name: Application quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request can change what a player sees. The screenshot suite is the slowest check (about ten minutes), so a pull request that only
  # touches tests, documentation, database migrations or scripts skips it. Anything under src/ or public/, the screenshot tests and baselines, the
  # email artwork tests, and the build, dependency and workflow configuration always run it, and so does every push to main.
  #
  # The list of changed files comes from GitHub's pull request API, not a git checkout: the repository's history is over a gigabyte (screenshot
  # baselines), and downloading it just to list file names was most of this job. If the list cannot be read, the screenshots run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "The changed files could not be listed: running the screenshot suite to be safe."
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -Eq '^(src/|public/|test/visual/|test/e2e/|test/helpers/|test/email-artwork|package(-lock)?\.json$|next\.config|postcss|tailwind|tsconfig|playwright|\.github/workflows/quality\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No file that can change what a player sees: the screenshot suite is skipped."
          fi

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "build-only-publishable-key"
      SUPABASE_SECRET_KEY: "build-only-secret-key"
      PLAYER_AUTH_PEPPER: "build-only-player-auth-pepper-value"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Production dependencies block at high severity. The full tree blocks
      # critical advisories; reviewed dev-only exceptions live in the security
      # policy and remain visible through Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
      - run: npm run build

  # Exact-match screenshots of every view, state, width and theme, in the same
  # pinned browser image the Linux baselines were recorded in.
  #
  # The suite runs as four shards in parallel (each builds the site and runs a quarter of the tests), so the check takes a few minutes instead of ten
  # or more. The repository is public, so the extra runners cost nothing. Nothing requires this check by name; the job names are "visual (1/4)" to "visual (4/4)".
  visual:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    name: visual (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:visual -- --shard=${{ matrix.shard }}/4
      # Only the email artwork test, run from its own file: `npm test` with a name pattern still starts every test file (a minute and a half).
      - if: matrix.shard == 1
        run: node --test test/email-artwork-baseline.test.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
