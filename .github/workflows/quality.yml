name: Application quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "build-only-publishable-key"
      SUPABASE_SECRET_KEY: "build-only-secret-key"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
      - run: npm run lint
      - run: npm test
      # Next's transitive sharp/libheif advisory currently has no upstream fix;
      # keep the gate strict for critical advisories without blocking every
      # deploy on an acknowledged high-severity dependency with no remediation.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
