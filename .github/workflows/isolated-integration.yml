name: Isolated integration checks

on:
  workflow_dispatch:
    inputs:
      full_season_drill:
        description: Run the one-time fictional full-season lifecycle exercise
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 14 * * 3"

permissions:
  contents: read

concurrency:
  group: isolated-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database-and-browser:
    runs-on: ubuntu-latest
    environment: isolated-test
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PICKEM_TEST_DATABASE_CONFIRMATION: ${{ vars.PICKEM_TEST_DATABASE_CONFIRMATION }}
      PICKEM_TEST_SUPABASE_URL: ${{ secrets.PICKEM_TEST_SUPABASE_URL }}
      PICKEM_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PICKEM_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      PICKEM_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PICKEM_TEST_SUPABASE_PUBLISHABLE_KEY }}
      PICKEM_E2E_ENABLED: "true"
      PICKEM_FULL_SEASON_DRILL: ${{ inputs.full_season_drill && 'true' || 'false' }}
    steps:
      - name: Confirm isolated test environment
        run: |
          test "$PICKEM_TEST_DATABASE_CONFIRMATION" = "isolated"
          test -n "$PICKEM_TEST_SUPABASE_URL"
          test -n "$PICKEM_TEST_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$PICKEM_TEST_SUPABASE_PUBLISHABLE_KEY"
          echo "Using the explicitly confirmed isolated test environment."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:season-drill
